# Evaluation configuration.
#
# `final_test` (Task 8, src/evaluation/final_test.py), `robustness`
# (src/evaluation/robustness.py), and `ood_uncertainty`
# (src/evaluation/ood_uncertainty.py) are implemented and use their own
# sections + `output_paths:` below. `selective_prediction.coverage_levels`
# is also read by ood_uncertainty.py (selective risk/coverage on the clean
# test condition). Calibration remains a schema-only placeholder for a
# later task - nothing reads `calibration:` yet. Thresholds/bin counts
# under that section are PROVISIONAL defaults, not yet used by any code.

seed: 42

# Core final-test metrics (Task 8) - matches exactly what
# src/evaluation/metrics.py computes; `pr_auc_macro` added here since the
# original placeholder list predates Task 8's implementation and omitted
# it.
metrics:
  - accuracy
  - balanced_accuracy
  - precision_macro
  - recall_macro
  - f1_macro
  - auroc_macro
  - pr_auc_macro
  - confusion_matrix

# Final-test inference settings (Task 8). These affect only how many
# samples are batched per forward pass and how many dataloader worker
# processes are used - never what data is evaluated or how predictions
# are computed (inference is always plain fp32, torch.inference_mode(),
# model.eval(), no shuffling, no dropped samples - see
# src/evaluation/final_test.py). batch_size=16 matches the project's
# other default batch size (configs/training.yaml); num_workers=2 matches
# the value already verified safe for reproducibility on Colab (see
# REPRODUCIBILITY.md) - runtime preprocessing has no randomness, so worker
# count cannot affect results, only throughput.
final_test:
  batch_size: 16
  num_workers: 2

calibration:
  num_bins: 15
  metrics: [ece, mce, brier_score]

uncertainty:
  mc_samples: 20
  methods: [mc_dropout, evidential]

selective_prediction:
  # PROVISIONAL coverage sweep for risk-coverage curves.
  coverage_levels: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5]

# Robustness evaluation (src/evaluation/robustness.py): degrades already-
# loaded test images IN MEMORY (never data/raw/, never test_original.csv)
# and re-evaluates each already-frozen checkpoint. `degradations` below
# are FIXED, predefined severities - NOT tuned from any observed test
# result; changing these after seeing a robustness number would defeat
# the purpose of a robustness check. batch_size/num_workers are the same
# kind of inference-only, results-independent knobs as `final_test:`
# above (see its comment - identical reasoning applies here).
robustness:
  batch_size: 16
  num_workers: 2
  degradations:
    brightness: [0.70, 0.85, 1.15, 1.30]
    contrast: [0.70, 0.85, 1.15, 1.30]
    gaussian_noise: [0.02, 0.05, 0.10]  # std dev, image values in [0,1] before normalization
    gaussian_blur: [0.5, 1.0, 2.0]      # sigma
    reduced_resolution: [168, 112, 56]  # downsample to NxN then restore to the configured image size

# Feature-distance OOD detector + EDL uncertainty combination
# (src/evaluation/ood_uncertainty.py, AA-EvidentNet only). Calibrated
# ENTIRELY from train_original.csv (class prototypes) and val_original.csv
# (normalization ranges + combine_weight selection) - never from
# test_original.csv. `degradations` reuses the exact same fixed severities
# as `robustness:` above (kept as its own copy here, not a YAML anchor, so
# either section can be read/overridden independently without coupling the
# two features' configs together). `weight_grid` is a FIXED, predefined
# search space for combine_weight - the value actually used is always
# whichever grid point maximizes val_original error-detection AUROC (see
# select_combine_weight()), recorded in every run's metadata.json.
ood_uncertainty:
  batch_size: 16
  num_workers: 2
  weight_grid: [0.0, 0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
  degradations:
    brightness: [0.70, 0.85, 1.15, 1.30]
    contrast: [0.70, 0.85, 1.15, 1.30]
    gaussian_noise: [0.02, 0.05, 0.10]  # std dev, image values in [0,1] before normalization
    gaussian_blur: [0.5, 1.0, 2.0]      # sigma
    reduced_resolution: [168, 112, 56]  # downsample to NxN then restore to the configured image size

statistics:
  multi_seed_seeds: [42, 123, 456, 789, 2026]
  bootstrap_samples: 1000
  confidence_level: 0.95

output_paths:
  tables_dir: results/tables
  figures_dir: results/figures
  raw_predictions_dir: results/raw_predictions
  # Deliberately separate from raw_predictions_dir/tables_dir above -
  # robustness outputs must never land in, overwrite, or be confused with
  # Task 8's clean final-test outputs.
  robustness_dir: results/robustness
  # Deliberately separate from every path above - ood_uncertainty outputs
  # must never land in, overwrite, or be confused with Task 8's clean
  # final-test outputs or robustness.py's own outputs.
  ood_uncertainty_dir: results/ood_uncertainty
