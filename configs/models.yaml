# Model configuration for AA-EvidentNet baselines.
#
# All three baselines (ResNet50, EfficientNetB0, MaxViT) are implemented as
# a single uniform wrapper around timm.create_model
# (src/models/base.py: TimmBackboneModel), so architecture differences
# never leak into training/evaluation code - every model exposes the same
# forward(images) / forward(images, return_features=True) interface.
# `embedding_dim` below is informational (for readers/docs); the actual
# feature dimension used at runtime is always read from the instantiated
# model itself (backbone.num_features), never hard-coded elsewhere.

seed: 42
num_classes: 10
image_size: 224

baselines:
  resnet50:
    architecture: resnet50           # timm model name
    library: timm
    pretrained: true
    num_classes: 10
    image_size: 224
    dropout: 0.0
    embedding_dim: 2048              # informational; see backbone.num_features

  efficientnetb0:
    architecture: efficientnet_b0
    library: timm
    pretrained: true
    num_classes: 10
    image_size: 224
    dropout: 0.0
    embedding_dim: 1280

  maxvit:
    # maxvit_tiny_tf_224: the smallest MaxViT-TF variant with native
    # 224x224 ImageNet-1k pretrained weights available in timm
    # (maxvit_tiny_tf_224.in1k), chosen to fit the target RTX 3050 6GB
    # (~30M params - a similar memory footprint to ResNet50/EfficientNetB0
    # at this resolution). This is a deliberate hardware-driven default,
    # not a scientifically tuned choice; verified against the installed
    # timm==1.0.28 (`timm.list_models('maxvit_tiny_tf_224*', pretrained=True)`)
    # rather than assumed.
    architecture: maxvit_tiny_tf_224
    library: timm
    pretrained: true
    num_classes: 10
    image_size: 224
    dropout: 0.0
    embedding_dim: 512

# ---------------------------------------------------------------------------
# AA-EvidentNet (proposed model) - ARCHITECTURE implemented in Task 7
# (src/models/aa_evidentnet.py). CS-SupCon and EDL training objectives,
# ablations, and full training are NOT implemented yet (later tasks) -
# this config only drives the forward architecture:
#
#   global branch: `global_backbone` (a timm model, pooled features)
#       -> Linear projection -> embedding_dim
#   local branch: a lightweight 4-block CNN (LocalBranch), raw width
#       `local_feature_dim` -> Linear projection -> embedding_dim
#   adaptive fusion: fused = alpha*global + (1-alpha)*local, where
#       alpha = sigmoid(a single learnable scalar), always in (0, 1)
#   classification head: Linear(embedding_dim, num_classes) on `fused`
#
# `embedding_dim` (default 256, per the project's research design) is the
# shared representation space both branches project into - NOT the same
# as global_backbone's own native feature width, which is read from the
# instantiated backbone (`num_features`), never hard-coded.
# ---------------------------------------------------------------------------
proposed:
  aa_evidentnet:
    name: aa_evidentnet
    global_backbone: maxvit_tiny_tf_224   # timm model name for the global branch
    pretrained: true
    num_classes: 10
    image_size: 224
    embedding_dim: 256       # shared embedding dimension (global/local projected + fused)
    local_feature_dim: 128   # raw local-branch output width, before projection to embedding_dim
    dropout: 0.0
    # Reserved for a later task - not read by src/models/aa_evidentnet.py yet.
    uncertainty_head: evidential
    mc_samples: 20

registry:
  # Maps CLI --model values / create_model() names to baselines.*/proposed.*
  # entries above. Extend as new models are added.
  resnet50: baselines.resnet50
  efficientnetb0: baselines.efficientnetb0
  maxvit: baselines.maxvit
  aa_evidentnet: proposed.aa_evidentnet
