# Loss function configuration.
#
# `baseline` (cross_entropy): `label_smoothing` is consumed by the AA-EvidentNet
# combined objective's classification term (src/losses/combined.py); baseline
# model training (src/training/run_baseline.py) still uses plain
# nn.CrossEntropyLoss() unmodified. `class_weighting` values other than
# `none` are not implemented -- fail clearly rather than being ignored.
# `cs_supcon` (Task 8) and `edl` (Task 9) are implemented in
# src/losses/cs_supcon.py and src/losses/evidential.py respectively.
# Since Task 7's completion, both are wired into the combined AA-EvidentNet
# training objective (src/losses/combined.py: CombinedAAEvidentNetLoss,
# used by src/training/run_aa_evidentnet.py) as:
#
#     L_total = L_classification + cs_supcon.loss_weight * L_CS-SupCon
#                                 + edl.loss_weight * L_EDL
#
# -- see README.md ("AA-EvidentNet training orchestration and the combined
# objective") for what has and hasn't actually been run with it.

seed: 42

baseline:
  name: cross_entropy
  label_smoothing: 0.0
  class_weighting: none  # only "none" is implemented; any other value fails clearly

# ---------------------------------------------------------------------------
# CS-SupCon: Class-Similarity Supervised Contrastive Loss (Task 8).
#
# Implemented in src/losses/cs_supcon.py. Extends standard supervised
# contrastive learning (Khosla et al., 2020) with explicit awareness of
# clinically ambiguous ophthalmic class pairs: ordinary SupCon treats every
# incorrect class identically as a negative, but this project specifically
# wants the model pushed harder to separate embeddings for pairs a
# clinician could plausibly confuse. Ambiguity pairs are listed below by
# canonical class name (must match configs/dataset.yaml: class_names
# exactly) - they are resolved to indices via the same alphabetical
# ordering src/data/dataset.py: build_class_to_idx uses, never a
# separately hard-coded mapping.
#
# PROVISIONAL: `temperature`, `loss_weight`, and `ambiguity_weight` below
# have NOT been experimentally tuned for this dataset/architecture.
# temperature=0.1 is the common default from the original SupCon paper;
# ambiguity_weight=2.0 is an illustrative "twice the weight of an ordinary
# negative" choice. This task (8) implements the methodology only - no
# performance claim is made about these values.
# ---------------------------------------------------------------------------
cs_supcon:
  enabled: true
  temperature: 0.1
  loss_weight: 1.0
  ambiguity_weight: 2.0
  ambiguity_pairs:
    # Clinically motivated ambiguous/hard class pairs (see README.md).
    # Preserved unchanged for comparison/ablation against the new learned
    # mechanism below - never silently deleted or replaced.
    - ["Healthy", "Glaucoma"]
    - ["Disc Edema", "Glaucoma"]
    - ["Diabetic Retinopathy", "Central Serous Chorioretinopathy"]

  # ---------------------------------------------------------------------
  # Learned class-level ambiguity (feature/learned-ambiguity, Phase 1 and
  # Phase 3-experimental).
  #
  # `ambiguity_source` selects how the per-pair negative weight in
  # CS-SupCon is determined (see src/losses/ambiguity.py and
  # src/losses/cs_supcon.py for the exact math):
  #   - "fixed_pairs" (default): the ambiguity_weight/ambiguity_pairs
  #     above, EXACTLY as before this field existed. An existing
  #     configs/losses.yaml with no `ambiguity_source` key at all parses
  #     to this same default - zero behavior change unless reconfigured.
  #   - "learned_class" (Phase 1): w(i,a) = 1 + ambiguity_scale *
  #     A[y_i, y_a], where A is a FROZEN, non-trainable K x K matrix built
  #     once, before training begins, from an existing reference
  #     AA-EvidentNet checkpoint's embeddings over train_original.csv only
  #     (class PROTOTYPE cosine similarity - see
  #     src/training/ambiguity_setup.py) - never from validation or test
  #     data, never updated during the new training run.
  #   - "learned_class_affinity" (Phase 3-experimental, CONTROLLED
  #     EXPERIMENT ONLY - not yet run): the IDENTICAL formula and
  #     IDENTICAL freezing/timing guarantees as "learned_class" above, but
  #     A is Phase 3's continuous class-affinity matrix instead of Phase
  #     1's class-prototype matrix (mean top-m=5 cosine affinity to each
  #     class's train embeddings, symmetrized, min-max rescaled - see
  #     src/losses/class_affinity_ambiguity.py and
  #     src/training/class_affinity_ambiguity_cs_supcon_setup.py). The
  #     ONLY intended difference from a "learned_class" run under
  #     otherwise identical settings is which pre-built matrix is
  #     installed - everything else (architecture, optimizer, scheduler,
  #     augmentation, seed, EDL, this same ambiguity_scale, early
  #     stopping, manifests, checkpoint-selection criterion) is unchanged.
  #
  # `ambiguity_scale` is PROVISIONAL, not tuned from any observed result -
  # 1.0 was chosen so that a class pair with maximal learned ambiguity
  # (A[a,b]=1) receives the same weight (2.0) the existing
  # ambiguity_weight default already uses for a fixed hard pair, keeping
  # the two mechanisms' magnitudes directly comparable. This SAME value
  # is reused, unmodified, for "learned_class_affinity" - it is not a
  # separately chosen or tuned number for that mode.
  #
  # NOTE: "learned_class_sample" (letting each anchor's OWN sample-level
  # ambiguity further modulate this weight) is intentionally NOT a valid
  # value yet - sample-level ambiguity is analysis-only in this phase
  # (src/evaluation/ambiguity_validation.py); it does not influence
  # training. Setting ambiguity_source to that string raises a clear
  # "not implemented in this phase" error rather than being silently
  # accepted or ignored.
  ambiguity_source: fixed_pairs
  ambiguity_scale: 1.0

  # Required ONLY when ambiguity_source is learned_class or
  # learned_class_affinity - path to the existing, already-frozen
  # AA-EvidentNet checkpoint whose embeddings (over train_original.csv
  # only) are used to build the class-ambiguity matrix
  # (src/training/ambiguity_setup.py for "learned_class",
  # src/training/class_affinity_ambiguity_cs_supcon_setup.py for
  # "learned_class_affinity"). No default is provided (null): a missing
  # value fails loudly with a clear config error rather than silently
  # skipping the mechanism. Unused, and never validated, when
  # ambiguity_source=fixed_pairs.
  reference_checkpoint_path: null
  reference_model_name: aa_evidentnet

# ---------------------------------------------------------------------------
# EDL: Evidential Deep Learning (Task 9).
#
# Implemented in src/losses/evidential.py. Dirichlet-based evidential
# classification (Sensoy, Kaplan, Kandemir, 2018, "Evidential Deep
# Learning to Quantify Classification Uncertainty", NeurIPS) - ONE of
# several published EDL formulations, not claimed to be universally
# optimal.
#
# Pipeline: evidence = softplus(raw_output) >= 0; alpha = evidence + 1
# (>= 1, Dirichlet parameters); S = sum(alpha); probabilities = alpha / S;
# uncertainty = num_classes / S (always in (0, 1]).
#
# Loss = Bayes risk of cross-entropy under Dir(alpha)
#            sum_k y_k * (digamma(S) - digamma(alpha_k))
#      + lambda_t * KL[Dir(y + (1-y)*alpha) || Dir(1,...,1)]
#   where lambda_t = kl_weight_max * min(1, epoch / kl_annealing_epochs)
#   is linearly annealed so the KL regularizer (which shrinks evidence for
#   INCORRECT classes) does not dominate the loss before the model has
#   had a chance to accumulate correct-class evidence early in training.
#
# PROVISIONAL: none of the values below have been experimentally tuned for
# this dataset/architecture - this task (9) implements the methodology
# only. No training has been performed with EDL.
# ---------------------------------------------------------------------------
edl:
  enabled: true
  loss_weight: 1.0
  kl_annealing_epochs: 10
  kl_weight_max: 1.0
  epsilon: 1.0e-8
